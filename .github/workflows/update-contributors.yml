name: Update Contributor Stats

on:
  release:
    types: [published]

jobs:
  update-contributors:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Run Contributors Script
        run: python3 .github/scripts/contributors.py --update-readme

      - name: Commit & Push README Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "[skip ci] Update contributor stats for ${GITHUB_REF_NAME}"
            git push origin main
          fi
